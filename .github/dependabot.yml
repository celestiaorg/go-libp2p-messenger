version: 2

# Configure security-update titles without enabling version updates.
updates:
  - package-ecosystem: gomod
    directory: "/"
    commit-message:
      prefix: "chore(deps): [medium] "
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    commit-message:
      prefix: "chore(deps): [medium] "
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
